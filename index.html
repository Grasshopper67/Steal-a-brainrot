<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steal a Brainrot - 2D Edition</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body {
    background-color: #121218;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  #ui-bar {
    width: 900px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1e1e2a;
    padding: 12px 20px;
    border-radius: 10px 10px 0 0;
    border: 2px solid #33334d;
    border-bottom: none;
  }
  .stat { font-size: 18px; font-weight: bold; }
  .money { color: #4ade80; }
  .income { color: #facc15; font-size: 14px; }
  .rival-money { color: #f87171; }
  canvas {
    background: #232332;
    border: 2px solid #33334d;
    border-radius: 0 0 10px 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  #controls-hint {
    margin-top: 10px;
    color: #9ca3af;
    font-size: 14px;
  }
  kbd {
    background: #2d2d3f;
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid #4b4b66;
    color: #fff;
  }
</style>
</head>
<body>

<div id="ui-bar">
  <div>
    <span class="stat money" id="player-cash">$50</span>
    <span class="income" id="player-income">(+$0/s)</span>
  </div>
  <div style="font-weight: 800; letter-spacing: 1px; color: #c084fc;">STEAL A BRAINROT</div>
  <div>
    <span class="stat rival-money" id="rival-cash">Bot: $50</span>
    <span class="income" id="rival-income">(+$0/s)</span>
  </div>
</div>

<canvas id="gameCanvas" width="900" height="550"></canvas>

<div id="controls-hint">
  Move: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or <kbd>Arrows</kbd> &nbsp;|&nbsp; 
  Buy / Steal / Slap: <kbd>SPACE</kbd> or <kbd>E</kbd>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Brainrot Tiers
const BRAINROT_TYPES = [
  { name: "Skibidi", cost: 25, income: 3, color: "#94a3b8", emoji: "🚽" },
  { name: "Rizzler", cost: 75, income: 10, color: "#38bdf8", emoji: "😎" },
  { name: "Sigma", cost: 200, income: 30, color: "#a855f7", emoji: "🗿" },
  { name: "Grimace", cost: 500, income: 80, color: "#ec4899", emoji: "🥤" },
  { name: "GigaChad", cost: 1200, income: 220, color: "#f59e0b", emoji: "💪" }
];

// Game State
const keys = {};
let conveyorItems = [];
let floatingTexts = [];
let spawnTimer = 0;
let incomeTimer = 0;

// Base Definitions
const playerBase = { x: 30, y: 125, w: 220, h: 300, color: "rgba(59, 130, 246, 0.2)", border: "#3b82f6", slots: [] };
const rivalBase = { x: 650, y: 125, w: 220, h: 300, color: "rgba(239, 68, 68, 0.2)", border: "#ef4444", slots: [] };

// Initialize 6 slots per base
function initSlots(base) {
  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < 2; col++) {
      base.slots.push({
        x: base.x + 40 + col * 90,
        y: base.y + 45 + row * 85,
        item: null
      });
    }
  }
}
initSlots(playerBase);
initSlots(rivalBase);

// Entities
const player = {
  x: 140, y: 275, radius: 18, speed: 4.2, color: "#3b82f6",
  cash: 50, carrying: null, stunTimer: 0, slapCooldown: 0
};

const bot = {
  x: 760, y: 275, radius: 18, speed: 3.4, color: "#ef4444",
  cash: 50, carrying: null, stunTimer: 0, slapCooldown: 0,
  state: "IDLE", target: null
};

// Input Listeners
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'KeyE') {
    handleAction(player, playerBase, bot, rivalBase);
  }
});
window.addEventListener('keyup', e => keys[e.code] = false);

function addFloatingText(text, x, y, color = "#fff") {
  floatingTexts.push({ text, x, y, color, life: 50 });
}

function getIncome(base) {
  return base.slots.reduce((sum, slot) => sum + (slot.item ? slot.item.income : 0), 0);
}

function getEmptySlot(base) {
  return base.slots.find(s => s.item === null);
}

// Core Interaction: Slap, Buy, or Steal
function handleAction(actor, ownBase, enemy, enemyBase) {
  if (actor.stunTimer > 0) return;

  // 1. Slap enemy if close
  const distToEnemy = Math.hypot(actor.x - enemy.x, actor.y - enemy.y);
  if (distToEnemy < 55 && actor.slapCooldown <= 0) {
    actor.slapCooldown = 45;
    enemy.stunTimer = 90; // 1.5 seconds stun
    addFloatingText("SLAP! 💥", enemy.x, enemy.y - 25, "#facc15");
    if (enemy.carrying) {
      addFloatingText(`DROPPED ${enemy.carrying.name}!`, enemy.x, enemy.y - 45, "#f87171");
      enemy.carrying = null; // Stolen item vanishes / returns
    }
    return;
  }

  // Cannot pick up if already carrying
  if (actor.carrying) return;

  // 2. Try buying from conveyor
  for (let i = conveyorItems.length - 1; i >= 0; i--) {
    const item = conveyorItems[i];
    if (Math.hypot(actor.x - item.x, actor.y - item.y) < 45) {
      if (actor.cash >= item.type.cost) {
        if (!getEmptySlot(ownBase)) {
          if (actor === player) addFloatingText("Base Full!", actor.x, actor.y - 25, "#f87171");
          return;
        }
        actor.cash -= item.type.cost;
        actor.carrying = { ...item.type };
        conveyorItems.splice(i, 1);
        addFloatingText(`-$${item.type.cost}`, actor.x, actor.y - 25, "#f87171");
        return;
      } else if (actor === player) {
        addFloatingText("Not enough cash!", actor.x, actor.y - 25, "#f87171");
      }
    }
  }

  // 3. Try stealing from enemy base
  for (let slot of enemyBase.slots) {
    if (slot.item && Math.hypot(actor.x - slot.x, actor.y - slot.y) < 40) {
      if (!getEmptySlot(ownBase)) {
        if (actor === player) addFloatingText("Base Full!", actor.x, actor.y - 25, "#f87171");
        return;
      }
      actor.carrying = slot.item;
      slot.item = null;
      addFloatingText("STOLEN! 🚨", actor.x, actor.y - 30, "#c084fc");
      return;
    }
  }
}

// Bot AI Logic
function updateBot() {
  if (bot.stunTimer > 0) {
    bot.stunTimer--;
    return;
  }
  if (bot.slapCooldown > 0) bot.slapCooldown--;

  // Defend base if player is inside rivalBase
  const playerInRivalBase = player.x > rivalBase.x && player.x < rivalBase.x + rivalBase.w &&
                            player.y > rivalBase.y && player.y < rivalBase.y + rivalBase.h;

  let targetX = bot.x;
  let targetY = bot.y;

  if (bot.carrying) {
    // Return to own base
    targetX = rivalBase.x + rivalBase.w / 2;
    targetY = rivalBase.y + rivalBase.h / 2;
  } else if (playerInRivalBase) {
    // Chase player to slap them!
    targetX = player.x;
    targetY = player.y;
    if (Math.hypot(bot.x - player.x, bot.y - player.y) < 50) {
      handleAction(bot, rivalBase, player, playerBase);
    }
  } else {
    // Decide whether to buy from conveyor or steal from player
    const affordable = conveyorItems.filter(i => bot.cash >= i.type.cost);
    const stealable = playerBase.slots.filter(s => s.item !== null);

    if (affordable.length > 0 && getEmptySlot(rivalBase)) {
      // Go to highest tier affordable item
      affordable.sort((a, b) => b.type.cost - a.type.cost);
      targetX = affordable[0].x;
      targetY = affordable[0].y;
      if (Math.hypot(bot.x - targetX, bot.y - targetY) < 35) {
        handleAction(bot, rivalBase, player, playerBase);
      }
    } else if (stealable.length > 0 && getEmptySlot(rivalBase) && Math.random() < 0.02) {
      bot.stealTarget = stealable[0];
    }

    if (bot.stealTarget && bot.stealTarget.item && !bot.carrying) {
      targetX = bot.stealTarget.x;
      targetY = bot.stealTarget.y;
      if (Math.hypot(bot.x - targetX, bot.y - targetY) < 35) {
        handleAction(bot, rivalBase, player, playerBase);
        bot.stealTarget = null;
      }
    }
  }

  // Move Bot
  const dx = targetX - bot.x;
  const dy = targetY - bot.y;
  const dist = Math.hypot(dx, dy);
  if (dist > 4) {
    bot.x += (dx / dist) * bot.speed;
    bot.y += (dy / dist) * bot.speed;
  }

  // Deposit if in own base
  if (bot.carrying && bot.x > rivalBase.x && bot.x < rivalBase.x + rivalBase.w &&
      bot.y > rivalBase.y && bot.y < rivalBase.y + rivalBase.h) {
    const slot = getEmptySlot(rivalBase);
    if (slot) {
      slot.item = bot.carrying;
      addFloatingText(`+${bot.carrying.name}`, slot.x, slot.y - 20, "#4ade80");
      bot.carrying = null;
    }
  }
}

// Main Update Loop
function update() {
  // Spawn conveyor items
  spawnTimer++;
  if (spawnTimer >= 110) {
    spawnTimer = 0;
    const rand = Math.random();
    let tier = 0;
    if (rand > 0.92) tier = 4;
    else if (rand > 0.80) tier = 3;
    else if (rand > 0.60) tier = 2;
    else if (rand > 0.35) tier = 1;

    conveyorItems.push({
      x: 450,
      y: -25,
      type: BRAINROT_TYPES[tier]
    });
  }

  // Move conveyor items
  for (let i = conveyorItems.length - 1; i >= 0; i--) {
    conveyorItems[i].y += 1.5;
    if (conveyorItems[i].y > canvas.height + 30) {
      conveyorItems.splice(i, 1);
    }
  }

  // Passive Income (every 60 frames = 1 sec)
  incomeTimer++;
  if (incomeTimer >= 60) {
    incomeTimer = 0;
    const pInc = getIncome(playerBase);
    const rInc = getIncome(rivalBase);
    player.cash += pInc;
    bot.cash += rInc;

    if (pInc > 0) addFloatingText(`+$${pInc}`, playerBase.x + 110, playerBase.y - 10, "#4ade80");
    if (rInc > 0) addFloatingText(`+$${rInc}`, rivalBase.x + 110, rivalBase.y - 10, "#4ade80");
  }

  // Player Movement
  if (player.stunTimer > 0) {
    player.stunTimer--;
  } else {
    let moveX = 0, moveY = 0;
    if (keys['KeyW'] || keys['ArrowUp']) moveY -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) moveY += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

    if (moveX !== 0 || moveY !== 0) {
      const len = Math.hypot(moveX, moveY);
      const currentSpeed = player.carrying ? player.speed * 0.85 : player.speed; // Slightly slower when carrying
      player.x += (moveX / len) * currentSpeed;
      player.y += (moveY / len) * currentSpeed;
    }
  }
  if (player.slapCooldown > 0) player.slapCooldown--;

  // Clamp player to arena
  player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

  // Deposit carried item into player base
  if (player.carrying && player.x > playerBase.x && player.x < playerBase.x + playerBase.w &&
      player.y > playerBase.y && player.y < playerBase.y + playerBase.h) {
    const slot = getEmptySlot(playerBase);
    if (slot) {
      slot.item = player.carrying;
      addFloatingText(`Secured ${player.carrying.name}!`, slot.x, slot.y - 20, "#4ade80");
      player.carrying = null;
    }
  }

  updateBot();

  // Update floating texts
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    floatingTexts[i].y -= 0.8;
    floatingTexts[i].life--;
    if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
  }

  // Update UI
  document.getElementById('player-cash').textContent = `$${player.cash}`;
  document.getElementById('player-income').textContent = `(+$${getIncome(playerBase)}/s)`;
  document.getElementById('rival-cash').textContent = `Bot: $${bot.cash}`;
  document.getElementById('rival-income').textContent = `(+$${getIncome(rivalBase)}/s)`;
}

// Render Loop
function drawBase(base, label) {
  ctx.fillStyle = base.color;
  ctx.strokeStyle = base.border;
  ctx.lineWidth = 3;
  ctx.fillRect(base.x, base.y, base.w, base.h);
  ctx.strokeRect(base.x, base.y, base.w, base.h);

  ctx.fillStyle = base.border;
  ctx.font = "bold 14px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(label, base.x + base.w / 2, base.y - 10);

  // Draw Slots
  for (let slot of base.slots) {
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.arc(slot.x, slot.y, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.15)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    if (slot.item) {
      drawBrainrot(slot.x, slot.y, slot.item, false);
    }
  }
}

function drawBrainrot(x, y, type, showCost) {
  ctx.fillStyle = type.color;
  ctx.beginPath();
  ctx.arc(x, y, 20, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = "20px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(type.emoji, x, y);

  ctx.font = "bold 11px sans-serif";
  ctx.fillStyle = "#fff";
  ctx.fillText(type.name, x, y + 28);

  if (showCost) {
    ctx.fillStyle = "#4ade80";
    ctx.fillText(`$${type.cost}`, x, y - 28);
  } else {
    ctx.fillStyle = "#facc15";
    ctx.fillText(`+$${type.income}/s`, x, y - 28);
  }
}

function drawEntity(ent, label) {
  // Body
  ctx.fillStyle = ent.stunTimer > 0 ? "#64748b" : ent.color;
  ctx.beginPath();
  ctx.arc(ent.x, ent.y, ent.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Name / Stun status
  ctx.fillStyle = "#fff";
  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(ent.stunTimer > 0 ? "STUNNED!" : label, ent.x, ent.y - 26);

  // Carried Brainrot overhead
  if (ent.carrying) {
    ctx.font = "22px sans-serif";
    ctx.fillText(ent.carrying.emoji, ent.x, ent.y - 45);
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Conveyor Belt
  ctx.fillStyle = "#181822";
  ctx.fillRect(405, 0, 90, canvas.height);
  ctx.strokeStyle = "#3f3f5a";
  ctx.lineWidth = 2;
  ctx.strokeRect(405, 0, 90, canvas.height);

  // Conveyor Stripes
  ctx.strokeStyle = "#2b2b3d";
  const offset = (Date.now() / 15) % 40;
  for (let y = offset - 40; y < canvas.height; y += 40) {
    ctx.beginPath();
    ctx.moveTo(410, y);
    ctx.lineTo(490, y + 15);
    ctx.stroke();
  }

  // Bases
  drawBase(playerBase, "YOUR BASE (DROP OFF)");
  drawBase(rivalBase, "RIVAL BASE (STEAL HERE)");

  // Conveyor Items
  for (let item of conveyorItems) {
    drawBrainrot(item.x, item.y, item.type, true);
  }

  // Player & Bot
  drawEntity(bot, "RIVAL BOT");
  drawEntity(player, "YOU");

  // Floating Texts
  for (let ft of floatingTexts) {
    ctx.fillStyle = ft.color;
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(ft.text, ft.x, ft.y);
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
