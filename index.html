<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steal a Brainrot - 3D Edition</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background-color: #0d0d12; color: #fff; overflow: hidden; }
  #ui-bar {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: 800px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(30, 30, 42, 0.85);
    backdrop-filter: blur(8px);
    padding: 12px 25px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.1);
    z-index: 10;
  }
  .stat { font-size: 18px; font-weight: bold; }
  .money { color: #4ade80; }
  .income { color: #facc15; font-size: 13px; }
  .rival-money { color: #f87171; }
  #crosshair {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 8px;
    height: 8px;
    background-color: rgba(255,255,255,0.7);
    border-radius: 50%;
    pointer-events: none;
    z-index: 10;
  }
  #controls-hint {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.6);
    padding: 8px 16px;
    border-radius: 8px;
    color: #9ca3af;
    font-size: 13px;
    z-index: 10;
    pointer-events: none;
  }
  kbd { background: #2d2d3f; padding: 2px 6px; border-radius: 4px; border: 1px solid #4b4b66; color: #fff; }
</style>
</head>
<body>

<div id="ui-bar">
  <div>
    <span class="stat money" id="player-cash">$50</span>
    <span class="income" id="player-income">(+$0/s)</span>
  </div>
  <div style="font-weight: 800; letter-spacing: 1px; color: #c084fc;">STEAL A BRAINROT 3D</div>
  <div>
    <span class="stat rival-money" id="rival-cash">Bot: $50</span>
    <span class="income" id="rival-income">(+$0/s)</span>
  </div>
</div>

<div id="crosshair"></div>

<div id="controls-hint">
  Move: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> &nbsp;|&nbsp; Look: Click & Drag Mouse &nbsp;|&nbsp; Buy/Steal/Slap: <kbd>SPACE</kbd> or <kbd>E</kbd>
</div>

<!-- Three.js r136 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r136/three.min.js"></script>

<script>
// Brainrot Tiers
const BRAINROT_TYPES = [
  { name: "Skibidi", cost: 25, income: 3, color: 0x94a3b8, emoji: "🚽" },
  { name: "Rizzler", cost: 75, income: 10, color: 0x38bdf8, emoji: "😎" },
  { name: "Sigma", cost: 200, income: 30, color: 0xa855f7, emoji: "🗿" },
  { name: "Grimace", cost: 500, income: 80, color: 0xec4899, emoji: "🥤" },
  { name: "GigaChad", cost: 1200, income: 220, color: 0xf59e0b, emoji: "💪" }
];

// Scene Setup
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121218);
scene.fog = new THREE.FogExp2(0x121218, 0.015);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
dirLight.castShadow = true;
scene.add(dirLight);

// Arena Ground
const floorGeo = new THREE.PlaneGeometry(60, 40);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e1e2d, roughness: 0.8 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Center Conveyor Belt
const convGeo = new THREE.BoxGeometry(6, 0.1, 40);
const convMat = new THREE.MeshStandardMaterial({ color: 0x272738 });
const conveyor = new THREE.Mesh(convGeo, convMat);
conveyor.position.set(0, 0.05, 0);
scene.add(conveyor);

// Bases Definition
const playerBase = { x: -18, z: 0, w: 10, h: 14, slots: [] };
const rivalBase = { x: 18, z: 0, w: 10, h: 14, slots: [] };

function createBaseVisual(base, colorHex, label) {
  const group = new THREE.Group();
  const baseGeo = new THREE.BoxGeometry(base.w, 0.2, base.h);
  const baseMat = new THREE.MeshStandardMaterial({ color: colorHex, transparent: true, opacity: 0.3 });
  const mesh = new THREE.Mesh(baseGeo, baseMat);
  mesh.position.set(base.x, 0.1, base.z);
  group.add(mesh);

  for (let r = -1; r <= 1; r++) {
    for (let c = -0.5; c <= 0.5; c += 1) {
      const slotX = base.x + c * 3.5;
      const slotZ = base.z + r * 3.5;
      
      const pedGeo = new THREE.CylinderGeometry(1.2, 1.4, 0.4, 16);
      const pedMat = new THREE.MeshStandardMaterial({ color: 0x33334d });
      const ped = new THREE.Mesh(pedGeo, pedMat);
      ped.position.set(slotX, 0.3, slotZ);
      group.add(ped);

      base.slots.push({ x: slotX, z: slotZ, item: null, mesh: null });
    }
  }
  scene.add(group);
}
createBaseVisual(playerBase, 0x3b82f6, "Your Base");
createBaseVisual(rivalBase, 0xef4444, "Rival Base");

// Game Entities (Added player.y to fix camera bug)
let player = {
  x: -18, y: 1.2, z: 8, radius: 1.2, speed: 0.12,
  cash: 50, carrying: null
};

let bot = {
  x: 18, y: 1.2, z: -8, radius: 1.2, speed: 0.08,
  cash: 50, carrying: null, mesh: null, stunTimer: 0
};

// Create Bot Mesh
const botGeo = new THREE.CapsuleGeometry(0.8, 1.5, 4, 8);
const botMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
bot.mesh = new THREE.Mesh(botGeo, botMat);
bot.mesh.position.set(bot.x, bot.y, bot.z);
scene.add(bot.mesh);

// Conveyor Items Collection
let conveyorItems = [];
let spawnTimer = 0;
let incomeTimer = 0;

// Input Management
const keys = {};
let isMouseDown = false;
let cameraYaw = Math.PI / 2;
let cameraPitch = 0.3;

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space' || e.code === 'KeyE') {
    handleAction();
  }
});
window.addEventListener('keyup', e => keys[e.code] = false);

window.addEventListener('mousedown', () => isMouseDown = true);
window.addEventListener('mouseup', () => isMouseDown = false);
window.addEventListener('mousemove', e => {
  if (isMouseDown) {
    cameraYaw -= e.movementX * 0.004;
    cameraPitch -= e.movementY * 0.004;
    cameraPitch = Math.max(0.1, Math.min(1.4, cameraPitch));
  }
});

function getEmptySlot(base) {
  return base.slots.find(s => s.item === null);
}

function getIncome(base) {
  return base.slots.reduce((sum, s) => sum + (s.item ? s.item.type.income : 0), 0);
}

// 3D Text Creator Helper using Canvas Texture
function createBrainrotMesh(type) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = "#232332";
  ctx.fillRect(0, 0, 256, 256);
  ctx.font = "bold 90px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(type.emoji, 128, 100);

  ctx.font = "bold 28px sans-serif";
  ctx.fillStyle = "#ffffff";
  ctx.fillText(type.name, 128, 195);

  const texture = new THREE.CanvasTexture(canvas);
  const geo = new THREE.BoxGeometry(1.8, 1.8, 1.8);
  const mat = new THREE.MeshStandardMaterial({ map: texture, color: type.color });
  return new THREE.Mesh(geo, mat);
}

// Action Trigger (Buy, Steal, Slap)
function handleAction() {
  const distToBot = Math.hypot(player.x - bot.x, player.z - bot.z);
  if (distToBot < 3.5) {
    bot.stunTimer = 120;
    if (bot.carrying) {
      scene.remove(bot.carrying.mesh);
      bot.carrying = null;
    }
    return;
  }

  if (player.carrying) return;

  for (let i = conveyorItems.length - 1; i >= 0; i--) {
    const item = conveyorItems[i];
    const dist = Math.hypot(player.x - item.mesh.position.x, player.z - item.mesh.position.z);
    if (dist < 2.5) {
      if (player.cash >= item.type.cost) {
        const slot = getEmptySlot(playerBase);
        if (!slot) return;

        player.cash -= item.type.cost;
        player.carrying = { type: item.type, mesh: createBrainrotMesh(item.type) };
        scene.add(player.carrying.mesh);
        scene.remove(item.mesh);
        conveyorItems.splice(i, 1);
        return;
      }
    }
  }

  for (let slot of rivalBase.slots) {
    if (slot.item && Math.hypot(player.x - slot.x, player.z - slot.z) < 2.5) {
      const pSlot = getEmptySlot(playerBase);
      if (!pSlot) return;

      player.carrying = slot.item;
      slot.item = null;
      return;
    }
  }
}

// Bot AI Logic
function updateBot() {
  if (bot.stunTimer > 0) {
    bot.stunTimer--;
    bot.mesh.material.color.setHex(0x64748b);
    return;
  }
  bot.mesh.material.color.setHex(0xef4444);

  let targetX = bot.x;
  let targetZ = bot.z;

  if (bot.carrying) {
    targetX = rivalBase.x;
    targetZ = rivalBase.z;
  } else {
    const affordable = conveyorItems.filter(i => bot.cash >= i.type.cost);
    if (affordable.length > 0 && getEmptySlot(rivalBase)) {
      targetX = affordable[0].mesh.position.x;
      targetZ = affordable[0].mesh.position.z;

      if (Math.hypot(bot.x - targetX, bot.z - targetZ) < 2) {
        const item = affordable[0];
        const idx = conveyorItems.indexOf(item);
        if (idx !== -1) {
          bot.cash -= item.type.cost;
          bot.carrying = { type: item.type, mesh: createBrainrotMesh(item.type) };
          scene.add(bot.carrying.mesh);
          scene.remove(item.mesh);
          conveyorItems.splice(idx, 1);
        }
      }
    }
  }

  const dx = targetX - bot.x;
  const dz = targetZ - bot.z;
  const dist = Math.hypot(dx, dz);
  if (dist > 0.5) {
    bot.x += (dx / dist) * bot.speed;
    bot.z += (dz / dist) * bot.speed;
  }
  bot.mesh.position.set(bot.x, bot.y, bot.z);

  if (bot.carrying && Math.hypot(bot.x - rivalBase.x, bot.z - rivalBase.z) < 3.5) {
    const slot = getEmptySlot(rivalBase);
    if (slot) {
      slot.item = bot.carrying;
      slot.item.mesh.position.set(slot.x, 1.2, slot.z);
      scene.add(slot.item.mesh);
      bot.carrying = null;
    }
  }
}

// Main Loop
function animate() {
  requestAnimationFrame(animate);

  spawnTimer++;
  if (spawnTimer >= 120) {
    spawnTimer = 0;
    const rand = Math.random();
    let tier = rand > 0.9 ? 4 : (rand > 0.7 ? 3 : (rand > 0.4 ? 2 : (rand > 0.2 ? 1 : 0)));
    const type = BRAINROT_TYPES[tier];
    
    const mesh = createBrainrotMesh(type);
    mesh.position.set(0, 1, -18);
    scene.add(mesh);
    conveyorItems.push({ type, mesh });
  }

  for (let i = conveyorItems.length - 1; i >= 0; i--) {
    conveyorItems[i].mesh.position.z += 0.06;
    if (conveyorItems[i].mesh.position.z > 18) {
      scene.remove(conveyorItems[i].mesh);
      conveyorItems.splice(i, 1);
    }
  }

  incomeTimer++;
  if (incomeTimer >= 60) {
    incomeTimer = 0;
    player.cash += getIncome(playerBase);
    bot.cash += getIncome(rivalBase);
  }

  let moveX = 0, moveZ = 0;
  if (keys['KeyW'] || keys['ArrowUp']) moveZ -= 1;
  if (keys['KeyS'] || keys['ArrowDown']) moveZ += 1;
  if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

  if (moveX !== 0 || moveZ !== 0) {
    const angle = Math.atan2(moveX, moveZ) + cameraYaw;
    player.x += Math.sin(angle) * player.speed;
    player.z += Math.cos(angle) * player.speed;
  }

  player.x = Math.max(-28, Math.min(28, player.x));
  player.z = Math.max(-18, Math.min(18, player.z));

  if (player.carrying && Math.hypot(player.x - playerBase.x, player.z - playerBase.z) < 4) {
    const slot = getEmptySlot(playerBase);
    if (slot) {
      slot.item = player.carrying;
      slot.item.mesh.position.set(slot.x, 1.2, slot.z);
      scene.add(slot.item.mesh);
      player.carrying = null;
    }
  }

  if (player.carrying) {
    player.carrying.mesh.position.set(player.x, player.y + 2.0, player.z);
    player.carrying.mesh.rotation.y += 0.03;
  }

  updateBot();

  const camDist = 10;
  camera.position.x = player.x + Math.sin(cameraYaw) * Math.cos(cameraPitch) * camDist;
  camera.position.y = Math.sin(cameraPitch) * camDist + 1;
  camera.position.z = player.z + Math.cos(cameraYaw) * Math.cos(cameraPitch) * camDist;
  camera.lookAt(player.x, player.y, player.z);

  document.getElementById('player-cash').textContent = `$${player.cash}`;
  document.getElementById('player-income').textContent = `(+$${getIncome(playerBase)}/s)`;
  document.getElementById('rival-cash').textContent = `Bot: $${bot.cash}`;
  document.getElementById('rival-income').textContent = `(+$${getIncome(rivalBase)}/s)`;

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
